services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: hohn
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: hohn
    volumes:
      - hohn_db:/var/lib/postgresql/data

  app:
    build: .
    restart: unless-stopped
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql+psycopg://hohn:${POSTGRES_PASSWORD}@db:5432/hohn
      JWT_SECRET: ${JWT_SECRET}
      JWT_ALGORITHM: HS256
      JWT_TTL_MINUTES: 120
      COOKIE_SECURE: 'true'
      ALLOWED_ORIGINS: https://hohn.18-196-0-127.sslip.io,http://18.196.0.127,http://localhost
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
    expose:
      - "8000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  hohn_db:
  caddy_data:
  caddy_config:
